<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinestableSMP - Official Hub</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }
        h1 {
            color: #ef4444;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        p {
            color: #94a3b8;
            font-size: 1.1rem;
            line-height: 1.6;
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }
        .card {
            background: #0f172a;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #334155;
        }
        .card h3 {
            color: #38bdf8;
            margin-top: 0;
        }
        .status-badge {
            display: inline-block;
            background: #22c55e;
            color: #fff;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1> MinestableSMP </h1>
        <p>Community for Builder,Miner,Pvper and Destroyer</p>
        
        <div class="status-badge">🟢 SKYNET_BOT Online 24/7</div>

        <div class="card-grid">
            <div class="card">
                <h3> Mega Builds</h3>
                <p>bigest pvp tower on server</p></p>
            </div>
            <div class="card">
                <h3> Redstone </h3>
                <p>...</p>
            </div>
            <div class="card">
                <h3>24/7 Bot Controlled</h3>
                <p>24/7 on aternos with SKYNET_BOT</p>
            </div>
        </div>
    </div>

</body>
</html>
